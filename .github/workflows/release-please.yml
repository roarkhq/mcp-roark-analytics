# Authors the MCP server's `release: <version>` PR from conventional commits, so
# a release is bump + changelog + tag + GitHub release rather than a manual
# package.json edit and a dispatch.
#
# This package rode the node SDK's release train while it lived in that repo -
# release-please bumped its package.json and manifest.json and one GitHub release
# shipped both. The split removed that coupling; this restores the automation
# standalone. release-please creates the tag and the GitHub release here, and
# `publish.yml` (on `release: published`) publishes to npm and attaches the
# bundle to that release.
#
# Inert until the `RELEASE_PLEASE_ENABLED` repository variable is 'true', so this
# is safe to merge before that variable is flipped. The token is minted per-run
# from the org-owned release GitHub App (APP_ID / APP_PRIVATE_KEY).
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: vars.RELEASE_PLEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Mint a short-lived installation token from the org-owned release GitHub
      # App (roark-release). This replaces the personal RELEASE_PLEASE_TOKEN PAT:
      # the App is owned by the org so it survives any one person leaving, its key
      # is never exposed as a long-lived token in a run, and - unlike GITHUB_TOKEN
      # - a release it creates DOES raise `release: published`, which is exactly
      # what `publish.yml` waits on.
      - name: Mint a token from the release App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          # The App token minted above, NOT GITHUB_TOKEN. A GitHub release created
          # with GITHUB_TOKEN does not raise `release: published`, so `publish.yml`
          # would never fire and the server would silently stop shipping.
          token: ${{ steps.app-token.outputs.token }}

      # A failure here stalls shipping silently: no release PR, so no publish.
      # Alert #alarms-prod. No-op until SLACK_ALARMS_PROD_WEBHOOK_URL is set.
      - name: Slack notify - release-please failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALARMS_PROD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo 'SLACK_ALARMS_PROD_WEBHOOK_URL unset; skipping'; exit 0; }
          text="🚨 release-please failed for \`@roarkanalytics/sdk-mcp\` - ${RUN_URL}"
          resp=$(curl -sS --max-time 15 -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text:$t}')" "$SLACK_WEBHOOK_URL") \
            || { echo '::warning::Slack request failed (transport or timeout); alert not delivered'; exit 0; }
          # Best-effort, but not silent: a non-"ok" webhook response surfaces as a
          # warning rather than vanishing.
          [ "$resp" = ok ] || echo "::warning::Slack webhook did not accept the alert: $resp"
