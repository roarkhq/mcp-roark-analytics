# Authors the MCP server's `release: <version>` PR from conventional commits, so
# a release is bump + changelog + tag + GitHub release rather than a manual
# package.json edit and a dispatch.
#
# This package rode the node SDK's release train while it lived in that repo -
# release-please bumped its package.json and manifest.json and one GitHub release
# shipped both. The split removed that coupling; this restores the automation
# standalone. release-please creates the tag and the GitHub release here, and
# `publish.yml` (on `release: published`) publishes to npm and attaches the
# bundle to that release.
#
# Inert until the `RELEASE_PLEASE_ENABLED` repository variable is 'true', so this
# is safe to merge before the token and variable are in place.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

env:
  # #alarms-prod, defined once here rather than inline in the alert step.
  SLACK_ALARMS_CHANNEL: 'C064B836PL2'

jobs:
  release-please:
    if: vars.RELEASE_PLEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          # NOT GITHUB_TOKEN. A GitHub release created with GITHUB_TOKEN does not
          # raise `release: published`, so `publish.yml` would never fire and the
          # server would silently stop shipping. A PAT is required
          # (RELEASE_PLEASE_TOKEN), as in the SDK repos.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # A failure here stalls shipping silently: no release PR, so no publish.
      # Alert #alarms-prod. No-op until SLACK_BOT_TOKEN is set.
      - name: Slack notify - release-please failed
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${SLACK_BOT_TOKEN:-}" ] || { echo 'SLACK_BOT_TOKEN unset; skipping'; exit 0; }
          text="🚨 release-please failed for \`@roarkanalytics/sdk-mcp\` - ${RUN_URL}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$(jq -n --arg t "$text" --arg c "$SLACK_ALARMS_CHANNEL" '{channel:$c,text:$t}')" >/dev/null || true
