# Publishes @roarkanalytics/sdk-mcp, and the .mcpb bundle beside it.
#
# Two ways in, sharing one build-check-publish body:
#
#   - `release: published` - the automated path. release-please.yml merges a
#     `release:` PR (bumping package.json and manifest.json together), cuts the
#     tag and creates the GitHub release, and that event fires this at the tagged
#     commit. Here the release already exists, so the bundle is ATTACHED to it
#     rather than creating it. This is why the release must be made with a PAT and
#     not GITHUB_TOKEN: a GITHUB_TOKEN release raises no `release: published`.
#   - `workflow_dispatch` - the manual path, for a hand-picked ref or a rehearsal.
#     No release exists yet, so this path CREATES it with the bundle, as before.
#     It still defaults `dry_run` to true.
#
# A regeneration that adds a tool is still not automatically a release: the human
# decision of WHEN to ship is made by merging the release PR.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check, but do not publish'
        type: boolean
        default: true
      tag:
        description: 'npm dist-tag to publish under'
        type: string
        default: 'latest'

concurrency:
  group: publish-mcp
  cancel-in-progress: false

# `contents: write` for the GitHub release the bundle is attached to. The npm
# publish authenticates separately, with NODE_AUTH_TOKEN.
permissions:
  contents: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      # Whichever branch or tag the run was dispatched from. Normally `main`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # A publish is immutable, so the suite runs here as well as in ci.yml: this
      # workflow can be dispatched from any ref, including one that never went
      # through a pull request.
      - name: Test
        run: pnpm test

      # `dist/` is what gets published, so every check below reads from there
      # rather than from the source package.json. The two differ: the build
      # rewrites the export map and the bin path and drops devDependencies.
      - name: Check what is about to be published
        id: check
        run: |
          set -euo pipefail

          version=$(jq -r -e '.version' dist/package.json)
          source_version=$(jq -r -e '.version' package.json)
          manifest_version=$(jq -r -e '.version' manifest.json)
          sdk_range=$(jq -r -e '.dependencies["@roarkanalytics/sdk"]' dist/package.json)
          sdk_version="${sdk_range#^}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing @roarkanalytics/sdk-mcp@$version against @roarkanalytics/sdk@$sdk_range"

          # The bundle carries its own manifest, and Claude Desktop reads the
          # version out of that one. They were kept in step by release-please's
          # `extra-files`; nothing does that now, so a bundle claiming 3.2.0
          # while npm serves 3.3.0 is one forgotten edit away.
          if [ "$manifest_version" != "$source_version" ]; then
            echo "::error::manifest.json says $manifest_version but package.json says $source_version. Both are bumped by hand in this repository; bump manifest.json too."
            exit 1
          fi

          # While this package lived inside the SDK repository the dependency was
          # a workspace link, rewritten to a real range at pack time. It declares
          # a published range directly now, so the failure left to guard against
          # is a range bumped ahead of the SDK's own release: it installs fine on
          # a machine with a warm cache and fails for the first customer who runs
          # `npx @roarkanalytics/sdk-mcp`.
          if ! npm view "@roarkanalytics/sdk@$sdk_version" version >/dev/null 2>&1; then
            echo "::error::@roarkanalytics/sdk@$sdk_version is not on npm, so this server would not install"
            exit 1
          fi

          # npm rejects a duplicate version anyway; failing here says why.
          if npm view "@roarkanalytics/sdk-mcp@$version" version >/dev/null 2>&1; then
            echo "::error::@roarkanalytics/sdk-mcp@$version is already published. Bump package.json and manifest.json first."
            exit 1
          fi

      # The version the server announces in its MCP handshake is a literal
      # compiled into `server.ts`. `build` syncs it from package.json, and this
      # is the assertion that it did: `@roarkanalytics/cli@0.1.0` published
      # reporting `2.31.0` because nothing checked, and npm publishes are
      # immutable.
      - name: Smoke test the built server
        run: |
          set -euo pipefail
          expected=$(jq -r -e '.version' dist/package.json)
          if ! grep -qF "version: '$expected'" dist/server.js; then
            echo "::error::dist/server.js does not report $expected, so this build would announce the wrong version to every client. scripts/sync-version.cjs runs in ./build; a mismatch means it did not."
            exit 1
          fi
          node dist/index.js --help > /dev/null
          echo "the built server reports $expected and its bin starts"

          # Existing on disk is not the same as shipping: npm drops some files
          # when it packs, so assert against the tarball it actually builds.
          cd dist
          npm pack --loglevel=error >/dev/null
          tarball=$(ls -- *.tgz)
          # Listed into a file and grepped from the file rather than from a pipe:
          # `grep -q` exits at the first match, closing the pipe while GNU tar is
          # still writing, and under `pipefail` that reports a present entry as
          # missing. The CLI's publish hit exactly this.
          entries="$RUNNER_TEMP/mcp-tarball-entries.txt"
          tar -tzf "$tarball" > "$entries"
          for entry in package/index.js package/server.js package/methods.js package/package.json; do
            if ! grep -qxF "$entry" "$entries"; then
              echo "::error::$entry is missing from the tarball npm packed"
              exit 1
            fi
          done
          rm -f "$tarball"
          echo 'the packed tarball carries the entry point, the server and the tool table'

      # A `release` event carries no inputs, so `inputs.tag` is empty there:
      # default it to `latest`. A release always publishes; only a manual dispatch
      # can ask for a dry run.
      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run != true
        working-directory: dist
        run: npm publish --access public --tag '${{ inputs.tag || 'latest' }}'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ROARK_NPM_TOKEN || secrets.NPM_TOKEN }}

      - name: Rehearse the publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        working-directory: dist
        run: npm publish --access public --tag '${{ inputs.tag || 'latest' }}' --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ROARK_NPM_TOKEN || secrets.NPM_TOKEN }}

      # After the npm publish rather than before: the bundle is a convenience, the
      # registry is the product. On the automated path release-please already cut
      # `v$VERSION`, so the bundle is uploaded to it; on a manual dispatch no
      # release exists yet, so it is created here as before.
      - name: Attach the bundle to the release
        if: github.event_name == 'release' || inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'release' ]; then
            gh release upload "v$VERSION" roarkanalytics_sdk_api.mcpb --clobber
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "Published \`@roarkanalytics/sdk-mcp@$VERSION\` to npm." \
              roarkanalytics_sdk_api.mcpb
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo '### @roarkanalytics/sdk-mcp ${{ steps.check.outputs.version }}'
            if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.dry_run }}' = 'true' ]; then
              echo 'Dry run: built, checked and packed. Nothing was published, and no release was cut.'
            else
              echo 'Published to npm under the `${{ inputs.tag || 'latest' }}` tag, with the bundle attached to the release.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Post the outcome to #alarms-prod. The "published" notify is skipped on a
      # dry-run dispatch, which publishes nothing. No-op until SLACK_ALARMS_PROD_WEBHOOK_URL is
      # set; jq builds the payload so message text cannot break it.
      - name: Slack notify - published
        if: success() && (github.event_name == 'release' || inputs.dry_run != true)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALARMS_PROD_WEBHOOK_URL }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo 'SLACK_ALARMS_PROD_WEBHOOK_URL unset; skipping'; exit 0; }
          text="📦 \`@roarkanalytics/sdk-mcp\` ${VERSION:-(new version)} published to npm"
          resp=$(curl -sS --max-time 15 -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text:$t}')" "$SLACK_WEBHOOK_URL") \
            || { echo '::warning::Slack request failed (transport or timeout); alert not delivered'; exit 0; }
          # Best-effort, but not silent: a non-"ok" webhook response surfaces as a
          # warning rather than vanishing.
          [ "$resp" = ok ] || echo "::warning::Slack webhook did not accept the alert: $resp"

      # Scoped to a real publish (release, or a non-dry-run dispatch), so a
      # dry-run rehearsal failing in build/test does not page #alarms-prod and
      # the "publish FAILED" wording stays accurate.
      - name: Slack notify - publish failed
        if: failure() && (github.event_name == 'release' || inputs.dry_run != true)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALARMS_PROD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo 'SLACK_ALARMS_PROD_WEBHOOK_URL unset; skipping'; exit 0; }
          text="🚨 \`@roarkanalytics/sdk-mcp\` publish FAILED - ${RUN_URL}"
          resp=$(curl -sS --max-time 15 -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text:$t}')" "$SLACK_WEBHOOK_URL") \
            || { echo '::warning::Slack request failed (transport or timeout); alert not delivered'; exit 0; }
          # Best-effort, but not silent: a non-"ok" webhook response surfaces as a
          # warning rather than vanishing.
          [ "$resp" = ok ] || echo "::warning::Slack webhook did not accept the alert: $resp"
