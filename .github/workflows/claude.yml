name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the review can compare against the base branch and
          # reason about what actually changed in the generated regions.
          fetch-depth: 0

      - name: PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Generated updates arrive as PRs opened by app-agent-codegen, so the
          # review job must accept that bot actor while still rejecting others.
          allowed_bots: 'app-agent-codegen'
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive review of this pull request.

            This is the Roark TypeScript MCP server (@roarkanalytics/sdk-mcp).
            Most of it is hand-maintained - the transports, auth, and the code
            tool runtime. Four files carry generated regions produced from
            Roark's OpenAPI spec by app-agent-codegen and updated via pull
            request: src/methods.ts, src/code-tool.ts, src/code-tool-worker.ts
            and src/local-docs-search.ts. The tool table, the code tool's prompt
            and its embedded docs index live in those regions.

            1. **Generated vs hand-maintained boundaries (highest priority; merge-blocking)**
               - Determine whether the change touches generated regions, the
                 hand-maintained runtime, or both, and whether that mix is
                 intended.
               - Changes inside generated regions should look like generator
                 output, not hand edits: hand-authored code in a generated region
                 will be overwritten on the next codegen PR and is a blocking
                 finding unless the region boundary is being deliberately moved.
               - Conversely, edits to the hand-maintained runtime should not
                 silently reshape the generated tool table, tool schemas, the code
                 tool prompt, or the docs index.
               - Verify the generated surface stays coherent: tool names, input
                 schemas, and the MCP tool set the server advertises should match
                 what the runtime dispatches. Flag drift between the tool table and
                 the code that serves it.
               - For dependency bumps (notably @roarkanalytics/sdk), check that the
                 MCP server still compiles and behaves against the published SDK,
                 not a local link.
               - Confirm src/server.ts's version literal stays in step with
                 package.json (CI runs `pnpm build` and fails if they diverge).

            2. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability

            3. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic (bearer token
                 handling, transport auth, the sandboxed code tool worker)

            4. **Performance**
               - Identify potential performance bottlenecks
               - Review request handling and serialization for efficiency
               - Check for memory leaks or resource issues

            5. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios

            6. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check tool/config documentation accuracy

            Provide detailed feedback using inline comments for specific issues.

            After reviewing, post a top-level summary comment on the PR with the following format:

            ## Code Review Summary

            | Category | Score | Notes |
            |----------|-------|-------|
            | Generated/Runtime Boundaries | X/5 | Brief note |
            | Code Quality | X/5 | Brief note |
            | Security | X/5 | Brief note |
            | Performance | X/5 | Brief note |
            | Testing | X/5 | Brief note |
            | Documentation | X/5 | Brief note |
            | **Overall** | **X/5** | |

            Scoring guide:
            - 0: Critical issues, must fix before merge
            - 1: Major issues that should be addressed
            - 2: Several concerns worth discussing
            - 3: Acceptable with minor suggestions
            - 4: Good quality with nitpicks only
            - 5: Excellent, no issues found

            The overall score cannot exceed the Generated/Runtime Boundaries
            score. Follow the score table with:
            - which files and generated regions the change touches;
            - whether generated and hand-maintained code stayed on their own sides
              of the boundary;
            - intentional changes versus accidental drift in the tool table,
              schemas, code tool prompt, or docs index;
            - blocking findings and missing regression tests;
            - a brief list of other key findings.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"

  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
