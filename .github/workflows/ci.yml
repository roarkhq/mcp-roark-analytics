# The MCP server's own CI.
#
# In sdk-roark-analytics-node this package had none of its own: it was covered by
# that repository's `ci.yml`, which built the workspace root and typechecked
# everything in it. Here the package is the whole repository, so this is just CI.
#
# The one thing it checks that the old arrangement could not: that this package
# compiles against a *published* `@roarkanalytics/sdk` rather than a workspace
# link. That is the whole substance of the split, and it is exactly what breaks
# first if the dependency range is bumped ahead of the SDK's own release.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything back: it checks out, installs, and runs. Without
# this the token is whatever the repository default is, which is write on a push
# event, and CodeQL's actions/missing-workflow-permissions flags it.
permissions:
  contents: read

jobs:
  test:
    name: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # The build is no longer covered by anyone else's workflow, and it is the
      # only place `scripts/sync-version.cjs` runs and the only place the `.mcpb`
      # bundle is produced. Both have shipped bugs before, one repository over.
      - name: Build
        run: pnpm build

      # `build` syncs the literal in `src/server.ts` from package.json, so a
      # checkout where they disagree builds green and commits nothing - and the
      # next person to read `server.ts` sees a version that was never published.
      # Fail here instead, where the fix is one `pnpm build` and a commit.
      - name: Check the version literal was committed in step with package.json
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/server.ts; then
            echo '::error::src/server.ts declares a different version from package.json. Run `pnpm build` and commit src/server.ts.'
            git --no-pager diff -- src/server.ts
            exit 1
          fi

      # The bundle is what Claude Desktop installs, and it is assembled by a
      # different path from the npm tarball: its own package.json, its own
      # `npm install`, its own file copy. It has broken while the tarball was
      # fine.
      - name: Check the bundle was produced
        run: test -f roarkanalytics_sdk_api.mcpb

      # The header of this file says the point of the split is that this package
      # compiles against a *published* SDK. It does - but compiling is not the
      # question, because the method table addresses the SDK by string and tsc
      # cannot follow a string. The question is whether the range in package.json
      # is true, and until now nothing asked it.
      #
      # `publish.yml` probes the RESOLVED SDK, which for a caret range is the
      # newest version npm had at that instant. That is a race against the SDK's
      # own release and it is run after release-please has already cut the tag.
      # Worse, this package ships no shrinkwrap, so winning that race on the
      # runner says nothing about a consumer's machine: they re-resolve the range
      # themselves and may land anywhere inside it.
      #
      # 4.2.0 went out that way. It declares `^4.0.0` and its table names
      # `agent.build` (SDK 4.2.0) plus six `agentConfig.*` methods (SDK 4.1.0);
      # installed against the 4.0.0 that same range admits, seven of a hundred
      # tools are undefined at call time. The publish was green because it ran
      # two hours after the SDK's.
      #
      # So ask the question that has no race in it: does the table resolve on the
      # OLDEST SDK the range allows? Two files in this repository decide it, it
      # is false the moment the generator outruns the range, and it is asked
      # here - on the regeneration PR, where the fix is a one-line bump instead
      # of a re-release.
      - name: Every tool resolves on the oldest SDK the range allows
        run: |
          set -euo pipefail

          sdk_range=$(jq -r -e '.dependencies["@roarkanalytics/sdk"]' package.json)

          # Ask the registry which PUBLISHED versions satisfy the range rather
          # than deriving the floor from the string. `${sdk_range#^}` would do
          # for the caret this package has always declared and silently lie
          # about anything else: `~4.2.0` and `>=4.2.0 <5` survive it unchanged
          # and get handed to `npm install` as a range, which then resolves to
          # the NEWEST match - the exact answer this step exists to stop
          # trusting - while the log still calls it the floor.
          #
          # `npm view pkg@<range> version` filters by the range and prints the
          # matches ascending, so `.[0]` is the lowest published version a
          # consumer could land on, whatever syntax the range is written in. It
          # is one string for a single match and an array for several, hence the
          # jq. (`versions`, plural, ignores the range and lists everything.)
          # Every message below is built up in a variable rather than written as
          # one backslash-continued string. A workflow annotation is a single
          # line, and inside double quotes `\<newline>` removes only the
          # backslash and the newline - the indentation that keeps the YAML
          # readable survives into the middle of the sentence, so the reader
          # would get "cannot be           installed".
          if ! matching=$(npm view "@roarkanalytics/sdk@$sdk_range" version --json 2>/dev/null) ||
             [ -z "$matching" ]; then
            # `--json` puts a structured error on STDOUT as well, so `$matching`
            # holds it even though the command failed. Read the code off it
            # rather than treating every failure as "no such version": a registry
            # outage or a DNS blip would otherwise be reported as the range
            # naming an SDK that does not exist, which is the one diagnosis
            # guaranteed to send the reader to the wrong file.
            code=$(jq -r '.error.code // "unknown"' <<<"$matching" 2>/dev/null || echo unknown)
            if [ "$code" = E404 ]; then
              # The "generator outran the release" case, which is precisely what
              # this step is here to catch, so it gets a crafted message rather
              # than a bare npm 404 forty lines further down.
              message="no published @roarkanalytics/sdk satisfies $sdk_range, so this package cannot be installed at all."
              message="$message Either the SDK release the regenerated table needs is not out yet - in which case"
              message="$message this stays red until it is, which is correct - or the range was bumped to a version"
              message="$message that will never exist."
            else
              message="could not ask npm which versions satisfy $sdk_range (error code $code), so the floor"
              message="$message could not be determined. This says nothing about the method table - it is the"
              message="$message registry lookup that failed, so re-run the job."
            fi
            echo "::error::$message"
            exit 1
          fi
          floor=$(jq -r 'if type == "array" then .[0] else . end' <<<"$matching")
          if [ -z "$floor" ] || [ "$floor" = null ]; then
            message="npm reported versions satisfying $sdk_range but no floor could be read out of the response."
            message="$message This is a bug in this step rather than in the range; the raw response was: $matching"
            echo "::error::$message"
            exit 1
          fi

          # In its own directory rather than alongside the server: resolution is
          # nearest-first, so an SDK installed next to the tarball could be shaded
          # by one nested under it and the check would answer for the wrong
          # version. The table comes from the tarball install, the SDK from here,
          # and check-sdk-resolution.cjs is told to keep the two apart.
          floor_sdk="$RUNNER_TEMP/floor-sdk"
          rm -rf "$floor_sdk"
          mkdir -p "$floor_sdk"
          (
            cd "$floor_sdk"
            npm init -y >/dev/null
            npm install "@roarkanalytics/sdk@$floor" --loglevel=error --no-audit --no-fund >/dev/null
          )

          cd dist
          # The name comes from `npm pack` itself rather than from `ls -- *.tgz`.
          # Globbing is right only while exactly one tarball is in dist/, which
          # is true on a fresh build and stops being true the moment a step
          # upstream packs without cleaning up - and then `ls` returns two names,
          # `$tarball` becomes both of them, and the install fails on a path that
          # does not exist. Asking the command that made the file is free.
          tarball=$(npm pack --loglevel=error --json | jq -r '.[0].filename')
          probe="$RUNNER_TEMP/floor-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          # `npm init -y` first, or npm walks up looking for a package.json and
          # finds this repository's.
          (
            cd "$probe"
            npm init -y >/dev/null
            npm install "$GITHUB_WORKSPACE/dist/$tarball" --loglevel=error --no-audit --no-fund >/dev/null
          )
          rm -f "$tarball"

          echo "package.json declares $sdk_range, so the oldest SDK a consumer may resolve is $floor"
          node "$GITHUB_WORKSPACE/scripts/check-sdk-resolution.cjs" "$probe" "$floor_sdk"
